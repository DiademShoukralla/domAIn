name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: domain
          POSTGRES_PASSWORD: domain
          POSTGRES_DB: domain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domain -d domain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://domain:domain@localhost:5432/domain
      TOKEN_ENCRYPTION_KEY: J1DKacOrXJ8dI6ByJL5wpw73UYWIjwpaQX6BFzxuBIw=
      BOOTSTRAP_API_KEY: test-api-key
      VOYAGE_API_KEY: test-voyage-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch main for test diff
        if: github.event_name == 'pull_request'
        run: git fetch origin main

      - name: Add main worktree
        if: github.event_name == 'pull_request'
        run: git worktree add ../domain-main origin/main

      - name: Lint
        run: ruff check src tests

      - name: Type check
        run: mypy src/domain

      - name: Run migrations
        run: alembic upgrade head

      - name: Unit tests
        if: always()
        run: pytest tests/unit --junitxml=unit-results.xml

      - name: Integration tests
        if: always()
        run: pytest tests/integration --junitxml=integration-results.xml

      - name: Build test summary
        if: always() && github.event_name == 'pull_request'
        run: python scripts/ci_test_summary.py unit-results.xml integration-results.xml --main-worktree ../domain-main > test-summary.md

      - name: Remove main worktree
        if: always() && github.event_name == 'pull_request'
        run: git worktree remove ../domain-main --force

      - name: Post test summary comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-test-summary
          path: test-summary.md
