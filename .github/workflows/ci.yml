name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test deploy/generate-env.sh
        run: bash deploy/tests/test_generate_env.sh

  package-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Verify non-editable install
        run: uv sync --frozen --no-dev

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: domain
          POSTGRES_PASSWORD: domain
          POSTGRES_DB: domain
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U domain -d domain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://domain:domain@localhost:5432/domain
      TOKEN_ENCRYPTION_KEY: J1DKacOrXJ8dI6ByJL5wpw73UYWIjwpaQX6BFzxuBIw=
      BOOTSTRAP_API_KEY: test-api-key
      VOYAGE_API_KEY: test-voyage-key
      ANTHROPIC_API_KEY: test-anthropic-key

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify lockfile is current
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Fetch main for test diff
        if: github.event_name == 'pull_request'
        run: git fetch origin main

      - name: Add main worktree
        if: github.event_name == 'pull_request'
        run: git worktree add ../domain-main origin/main

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run mypy src/domain

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Unit tests
        if: always()
        run: uv run pytest tests/unit --junitxml=unit-results.xml

      - name: Integration tests
        if: always()
        run: uv run pytest tests/integration --junitxml=integration-results.xml

      - name: Build test summary
        if: always() && github.event_name == 'pull_request'
        run: uv run python scripts/ci_test_summary.py unit-results.xml integration-results.xml --main-worktree ../domain-main > test-summary.md

      - name: Remove main worktree
        if: always() && github.event_name == 'pull_request'
        run: git worktree remove ../domain-main --force

      - name: Post test summary comment
        if: always() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ci-test-summary
          path: test-summary.md
