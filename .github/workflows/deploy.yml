name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          OWNER="$(echo "$GHCR_OWNER" | tr '[:upper:]' '[:lower:]')"
          API_IMAGE="ghcr.io/${OWNER}/domain:${IMAGE_TAG}"
          LANDING_IMAGE="ghcr.io/${OWNER}/domain-landing:${IMAGE_TAG}"
          docker build -t "$API_IMAGE" .
          docker build -t "$LANDING_IMAGE" -f deploy/landing/Dockerfile deploy/landing
          docker push "$API_IMAGE"
          docker push "$LANDING_IMAGE"

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            cd ~/domAIn && git pull
            IMAGE_TAG=${{ github.sha }} bash deploy/deploy.sh \
              --compose-file docker-compose.prod.yml \
              --env-file .env.production
