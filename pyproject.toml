[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "domain"
version = "0.1.0"
description = "domAIn knowledge layer and decision council backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "authlib>=1.3.2",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "cryptography>=43.0.0",
    "voyageai>=0.3.2",
    "pgvector>=0.3.6",
    "tiktoken>=0.8.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-dateutil",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/domain"]

[tool.hatch.build.targets.wheel.force-include]
"src/domain" = "domain"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["domain"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["authlib.*", "voyageai", "voyageai.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
